name: Publish npm Package

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

# Trusted Publishing 通过 OIDC 发布，无需 NPM_TOKEN。
permissions:
    contents: read
    id-token: write

# 同一引用上避免多个发布任务并发执行。
concurrency:
    group: npm-publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 12.18.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: pnpm

            # npm Trusted Publishing 需要 npm >= 11.5.1，固定大版本避免 runner 自带版本过旧。
            - name: Ensure npm version
              run: |
                  npm install -g npm@11
                  node --version
                  npm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            # 仅校验 tag 发布，手动触发时跳过。
            - name: Verify tag matches package version
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  version=$(node -p "require('./package.json').version")
                  tag="${GITHUB_REF_NAME#v}"
                  if [ "$tag" != "$version" ]; then
                    echo "::error::Tag v$tag 与 package.json 版本 $version 不一致"
                    exit 1
                  fi
                  echo "版本校验通过: $version"

            - name: Verify package
              run: npm pack --dry-run

            - name: Publish to npm
              run: npm publish --access public --provenance
